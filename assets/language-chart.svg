<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <defs>
    <radialGradient id="bg-grad" cx="15%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#182232"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="grad-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="24" fill="url(#bg-grad)" filter="url(#drop-shadow)"/>
  <rect x="1" y="1" width="758" height="418" rx="23" fill="none" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(35, 38)">
    <rect width="36" height="36" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3"/>
    <path d="M 12 11 L 7 18 L 12 25 M 24 11 L 29 18 L 24 25 M 19 9 L 17 27"
          stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="50" y="24" fill="#f8fafc" font-size="20" font-weight="700"
          font-family="system-ui, -apple-system, sans-serif" letter-spacing="-0.3">
      Languages Across My Projects
    </text>
  </g>

  <!-- Donut Chart -->
  <g transform="translate(195, 235)">

    <!-- HTML: 30% -->
    <path d="
      M 0,-115
      A 115,115 0 0 1 67.639,92.991
      L 44.112,60.646
      A 75,75 0 0 0 0,-75
      Z"
      fill="url(#grad-blue)"/>

    <!-- TypeScript: 20% -->
    <path d="
      M 67.639,92.991
      A 115,115 0 0 1 -109.365,35.563
      L -71.325,23.193
      A 75,75 0 0 0 44.112,60.646
      Z"
      fill="url(#grad-amber)"/>

    <!-- CSS: 20% -->
    <path d="
      M -109.365,35.563
      A 115,115 0 0 1 -67.639,-92.991
      L -44.112,-60.646
      A 75,75 0 0 0 -71.325,23.193
      Z"
      fill="url(#grad-yellow)"/>

    <!-- C: 10% -->
    <path d="
      M -67.639,-92.991
      A 115,115 0 0 1 -35.563,-109.365
      L -23.193,-71.325
      A 75,75 0 0 0 -44.112,-60.646
      Z"
      fill="url(#grad-indigo)"/>

    <!-- Makefile: 10% -->
    <path d="
      M -35.563,-109.365
      A 115,115 0 0 1 35.563,-109.365
      L 23.193,-71.325
      A 75,75 0 0 0 -23.193,-71.325
      Z"
      fill="url(#grad-orange)"/>

    <!-- JavaScript: 10% -->
    <path d="
      M 35.563,-109.365
      A 115,115 0 0 1 0,-115
      L 0,-75
      A 75,75 0 0 0 23.193,-71.325
      Z"
      fill="url(#grad-purple)"/>

  </g>

  <!-- Center Hole -->
  <g transform="translate(195, 235)">
    <circle cx="0" cy="0" r="52" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" fill="#ffffff" font-size="18"
          font-weight="700" font-family="system-ui, -apple-system, sans-serif">10</text>
    <text x="0" y="15" text-anchor="middle" fill="#64748b" font-size="11"
          font-weight="600" font-family="system-ui, -apple-system, sans-serif"
          letter-spacing="0.5">REPOS</text>
  </g>

  <!-- Legend -->
  <g transform="translate(405, 96)">

    <g transform="translate(0, 0)">
      <rect width="14" height="14" rx="4" fill="url(#grad-blue)"/>
      <text x="28" y="12" fill="#f1f5f9" font-size="14" font-weight="600" font-family="system-ui">HTML</text>
      <text x="215" y="12" text-anchor="end" fill="#94a3b8" font-size="13" font-family="system-ui">3 repos</text>
    </g>

    <g transform="translate(0, 40)">
      <rect width="14" height="14" rx="4" fill="url(#grad-amber)"/>
      <text x="28" y="12" fill="#f1f5f9" font-size="14" font-weight="600" font-family="system-ui">TypeScript</text>
      <text x="215" y="12" text-anchor="end" fill="#94a3b8" font-size="13" font-family="system-ui">2 repos</text>
    </g>

    <g transform="translate(0, 80)">
      <rect width="14" height="14" rx="4" fill="url(#grad-yellow)"/>
      <text x="28" y="12" fill="#f1f5f9" font-size="14" font-weight="600" font-family="system-ui">CSS</text>
      <text x="215" y="12" text-anchor="end" fill="#94a3b8" font-size="13" font-family="system-ui">2 repos</text>
    </g>

    <g transform="translate(0, 120)">
      <rect width="14" height="14" rx="4" fill="url(#grad-indigo)"/>
      <text x="28" y="12" fill="#f1f5f9" font-size="14" font-weight="600" font-family="system-ui">C</text>
      <text x="215" y="12" text-anchor="end" fill="#94a3b8" font-size="13" font-family="system-ui">1 repo</text>
    </g>

    <g transform="translate(0, 160)">
      <rect width="14" height="14" rx="4" fill="url(#grad-orange)"/>
      <text x="28" y="12" fill="#f1f5f9" font-size="14" font-weight="600" font-family="system-ui">Makefile</text>
      <text x="215" y="12" text-anchor="end" fill="#94a3b8" font-size="13" font-family="system-ui">1 repo</text>
    </g>

    <g transform="translate(0, 200)">
      <rect width="14" height="14" rx="4" fill="url(#grad-purple)"/>
      <text x="28" y="12" fill="#f1f5f9" font-size="14" font-weight="600" font-family="system-ui">JavaScript</text>
      <text x="215" y="12" text-anchor="end" fill="#94a3b8" font-size="13" font-family="system-ui">1 repo</text>
    </g>

  </g>

  <!-- Footer -->
  <line x1="35" y1="355" x2="725" y2="355" stroke="#1e293b" stroke-width="1.5"/>
  <text x="35" y="383" fill="#64748b" font-size="12" font-weight="500"
        font-family="system-ui, -apple-system, sans-serif">
    ✨ A repository can contain multiple languages
  </text>

</svg>
